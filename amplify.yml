version: 1
frontend:
  phases:
    preBuild:
      commands:
        - "echo === Working directory ==="
        - "pwd"
        - "ls -la"
        - "echo === Cloning TourGuideApp for schema types ==="
        # Le PAT passe par un en-tête HTTP, jamais dans l'URL : mis dans l'URL,
        # il était journalisé avec la ligne de commande et persistait dans
        # `/tmp/TourGuideApp/.git/config`, lié en symbolique dans l'arbre de build.
        - "git -c http.extraheader=\"AUTHORIZATION: basic $(printf 'x-access-token:%s' \"$GITHUB_PAT\" | base64 -w0)\" clone --depth 1 https://github.com/Theguiggs/TourGuideApp.git /tmp/TourGuideApp"
        - "(cd /tmp/TourGuideApp && npm install --no-save @aws-amplify/backend 2>/dev/null || true)"
        - "ln -sf /tmp/TourGuideApp ../TourGuideApp"
        - "echo === Validating versioned amplify_outputs.json ==="
        - "test -s amplify_outputs.json"
        - "node -e \"const d=require('./amplify_outputs.json'); if (!d.data?.url || !d.data?.model_introspection?.models?.StudioSession?.fields?.narrationMode) process.exit(1)\""
        - "npm install"
    build:
      commands:
        - "NEXT_PUBLIC_USE_STUBS=false npm run build"
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
